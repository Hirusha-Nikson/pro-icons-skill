# Checks the skill on every push and pull request.
# Pushing a version tag (e.g. v1.0.1) also publishes a GitHub Release with dev-icons.zip attached.
name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the skill and build dev-icons.zip
        run: python3 source/package_skill.py

      - name: Keep the zip for download from this run
        uses: actions/upload-artifact@v4
        with:
          name: dev-icons
          path: dist/dev-icons.zip

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the tag matches the plugin version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match plugin.json version $VERSION. Update the version or retag."
            exit 1
          fi

      - name: Build dev-icons.zip
        run: python3 source/package_skill.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/dev-icons.zip --title "dev-icons $GITHUB_REF_NAME" --generate-notes
